<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cruzadinha de Arquitetura Computacional</title>
  <link rel="stylesheet" href="Cruzadinha.css">
</head>
<body>

  <header class="topo">
    <h1 class="topo-titulo">Cruzadinha de Arquitetura Computacional</h1>
    <p class="topo-texto">
      Leia a pista, descubra o termo e digite as letras direto no tabuleiro.
      Clique numa casa já selecionada para trocar entre horizontal e vertical.
    </p>
  </header>

  <main class="jogo">

    <section class="area-tabuleiro" aria-label="Tabuleiro">
      <div class="barra">
        <button type="button" class="botao botao-principal" id="btnConferir">Conferir</button>
        <button type="button" class="botao" id="btnReiniciar">Reiniciar</button>
        <p class="contador" id="contador" aria-live="polite">0 de 16 palavras</p>
      </div>
      <p class="mensagem" id="mensagem" aria-live="polite"></p>

      <div class="rolagem">
        <div class="tabuleiro" id="tabuleiro"></div>
      </div>
    </section>

    <section class="area-pistas" aria-label="Pistas">
      <div class="bloco-pistas">
        <h2 class="bloco-titulo">Horizontais</h2>
        <ol class="lista-pistas" id="pistasH"></ol>
      </div>
      <div class="bloco-pistas">
        <h2 class="bloco-titulo">Verticais</h2>
        <ol class="lista-pistas" id="pistasV"></ol>
      </div>
    </section>

  </main>

  <script src="Cruzadinha.js"></script>
</body>
</html>
